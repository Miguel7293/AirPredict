name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  actions: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Identify previous healthy application version
        if: env.APP_BASE_URL != ''
        run: python scripts/previous_deployment.py
      - name: Start Render deployment of validated commit
        if: env.APP_BASE_URL != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo 'RENDER_DEPLOY_HOOK is missing'; exit 1; }
          LATEST=$(git ls-remote origin refs/heads/main | cut -f1)
          if test "$LATEST" != "$GITHUB_SHA"; then
            echo 'DEPLOY_SUPERSEDED=true' >> "$GITHUB_ENV"
            echo 'A newer main commit exists; its workflow will deploy it.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null --request POST "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"
      - name: Verify deployed commit and actual prediction
        id: verify
        if: env.APP_BASE_URL != '' && env.DEPLOY_SUPERSEDED != 'true'
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/check_deployment.py
      - name: Recover previous application after failed verification
        if: failure() && steps.verify.outcome == 'failure' && env.PREVIOUS_COMMIT != ''
        env:
          TARGET_COMMIT: ${{ env.PREVIOUS_COMMIT }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/rollback_application.py
      - name: Report pending hosting setup
        if: env.APP_BASE_URL == ''
        run: echo 'Container published. Hosting is pending APP_BASE_URL and Render secrets.' >> "$GITHUB_STEP_SUMMARY"

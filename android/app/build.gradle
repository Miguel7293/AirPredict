plugins { id 'com.android.application' }
android {
    namespace 'pe.airepredict'
    compileSdk 35
    defaultConfig {
        applicationId 'pe.airepredict'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.3.0'
        def baseUrl = System.getenv('APP_BASE_URL') ?: ''
        if (baseUrl && !(baseUrl ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?/)) throw new GradleException('APP_BASE_URL must be an HTTPS origin')
        buildConfigField 'String', 'DEFAULT_BASE_URL', '"' + baseUrl + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

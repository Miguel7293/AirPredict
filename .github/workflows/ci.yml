name: Validate application
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q
      - run: node tests/client_smoke.mjs
      - name: Verify deployment image and seeded model
        run: |
          docker build --build-arg APP_COMMIT=${{ github.sha }} -t airepredict:test .
          docker run -d --name airepredict-test -p 8000:8000 airepredict:test
          trap 'docker logs airepredict-test; docker rm -f airepredict-test' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/api/demo | python -c "import json,sys; d=json.load(sys.stdin); assert d['predicted_pm25'] >= 0 and d['mode']=='historical' and not d['is_current_forecast']"
          curl --fail --silent http://127.0.0.1:8000/api/atlas | python -c "import json,sys; d=json.load(sys.stdin); assert d['general_model']['training_sites'] >= 20 and len(d['sites']) >= 30"
          curl --fail --silent http://127.0.0.1:8000/static/vendor/leaflet.js -o /tmp/leaflet.js
          test "$(wc -c < /tmp/leaflet.js)" -gt 100000
          curl --fail --silent http://127.0.0.1:8000/static/departments.geojson | python -c "import json,sys; assert len(json.load(sys.stdin)['features'])==26"
          curl --fail --silent http://127.0.0.1:8000/static/region.geojson | python -c "import json,sys; assert len(json.load(sys.stdin)['features'])>=5"
          for station in 2415 2402 2351; do
            curl --fail --silent "http://127.0.0.1:8000/api/stations/$station/forecast?mode=historical" | python -c "import json,sys; d=json.load(sys.stdin); assert d['predicted_pm25'] >= 0 and d['mode']=='historical' and not d['is_current_forecast']"
          done

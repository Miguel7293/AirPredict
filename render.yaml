services:
  - type: web
    name: airpredict
    runtime: docker
    repo: https://github.com/Miguel7293/AirPredict
    branch: main
    plan: free
    region: oregon
    autoDeployTrigger: off
    healthCheckPath: /ready
    envVars:
      - key: AIRPREDICT_ROOT
        value: /tmp/airpredict-state/current
      - key: STATE_SYNC_REPOSITORY
        value: Miguel7293/AirPredict
      - key: PORT
        value: '8000'

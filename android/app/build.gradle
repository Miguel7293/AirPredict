plugins { id 'com.android.application' }
android {
    namespace 'pe.airepredict'
    compileSdk 35
    defaultConfig {
        applicationId 'pe.airepredict'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        def baseUrl = System.getenv('APP_BASE_URL') ?: ''
        if (baseUrl && !(baseUrl ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?/)) throw new GradleException('APP_BASE_URL must be an HTTPS origin')
        buildConfigField 'String', 'DEFAULT_BASE_URL', '"' + baseUrl + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

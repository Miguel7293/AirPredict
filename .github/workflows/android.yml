name: Android application
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile and inspect Android application
        working-directory: android
        run: gradle assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AirePredict-Android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
          retention-days: 30
  device:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise application and widget on Android 15
        timeout-minutes: 12
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/airepredict-avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/airepredict-android-user"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd --force --name airepredict --path "$ANDROID_AVD_HOME/airepredict.avd" --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x airepredict
          mkdir -p artifacts
          "$ANDROID_HOME/emulator/emulator" -avd airepredict -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect > artifacts/emulator.log 2>&1 < /dev/null &
          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" 2>/dev/null || true' EXIT
          timeout 180 adb wait-for-device
          BOOTED=false
          for i in $(seq 1 90); do
            if test "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1; then BOOTED=true; break; fi
            sleep 2
          done
          test "$BOOTED" = true || { echo 'Emulator did not finish booting'; exit 1; }
          adb shell input keyevent 82
          cd android
          set +e
          gradle connectedDebugAndroidTest --no-daemon
          TEST_STATUS=$?
          set -e
          adb pull /data/local/tmp/airepredict-application.png ../application.png || test "$TEST_STATUS" != 0
          adb pull /data/local/tmp/airepredict-widget.png ../widget.png || test "$TEST_STATUS" != 0
          adb pull /data/local/tmp/airepredict-settings.png ../settings.png || test "$TEST_STATUS" != 0
          adb pull /data/local/tmp/airepredict-station-connected.png ../station-connected.png || test "$TEST_STATUS" != 0
          adb pull /data/local/tmp/airepredict-location.png ../location.png || test "$TEST_STATUS" != 0
          adb pull /data/local/tmp/airepredict-location-nearby.png ../location-nearby.png || test "$TEST_STATUS" != 0
          adb pull /data/local/tmp/airepredict-permission-failure.png ../permission-failure.png || true
          exit "$TEST_STATUS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-evidence
          path: |
            artifacts/emulator.log
            application.png
            widget.png
            settings.png
            station-connected.png
            location.png
            location-nearby.png
            permission-failure.png
            android/app/build/reports/androidTests/
          retention-days: 30

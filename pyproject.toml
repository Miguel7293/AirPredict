[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airepredict"
version = "0.5.0"
description = "Atlas de PM2.5 de Perú y modelos supervisados por distrito"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "joblib>=1.3,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
report = ["matplotlib>=3.9,<4"]

[tool.setuptools.package-data]
airepredict = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg", "static/*.png", "static/*.webmanifest", "static/*.geojson", "static/vendor/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
